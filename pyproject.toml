[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kpx-price-forecast"
version = "0.1.0"
description = "Korean electricity market price variable forecasting (SMP, settlement, REC)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "kpx-price-forecast" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",  # pandas read_excel(.xlsx) engine — kpx_files.py / KMA grid
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=3.0,<4.0",
    "torch>=2.5,<3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "duckdb>=0.10",
    "holidays>=0.45",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
    "xmltodict>=0.13",
    "mlflow>=3.0,<4.0",
    "psycopg2-binary>=2.9",
    "matplotlib>=3.8,<4.0",
    "streamlit>=1.57,<2.0",
    "plotly>=6.0,<7.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.1", "pytest-cov>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
# `extra-models` is now legacy — xgboost was promoted to required (it's
# in MODEL_FACTORIES). statsmodels is still optional, used opportunistically.
extra-models = ["statsmodels>=0.14"]
polars = ["polars>=0.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that require external network access (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
