      기타: other
      무연탄: coal_anthracite
      바이오SRF: renewable_bio_srf
      바이오가스: renewable_biogas
      바이오매스: renewable_biomass
      수력: renewable_hydro
      양수: pumped_storage
      연료전지: renewable_fuel_cell
      원자력: nuclear
      유류: oil
      유연탄: coal_bituminous
      태양광: renewable_solar
      풍력: renewable_wind
      폐기물: renewable_waste
      해양: renewable_marine
    header_row: 0
    header_rows: null
    last_verified_at: '2026-05-25'
    limitations:
    - Vendor file column is named '전력거래금액(원)' → unit is KRW. Some data.go.kr
