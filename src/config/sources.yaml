defaults:
  rate_limit_per_minute: 50
  request_retry_attempts: 5
  request_retry_backoff_seconds: 2
  request_timeout_seconds: 30
  timezone: Asia/Seoul
file_sources:
  raw_weather_monthly_db_file:
    column_mapping:
      cloud_cover_mean: cloud_cover_mean
      hour_count: hour_count
      humidity_mean: humidity_mean
      period_month: period_month
      rainfall_sum: rainfall_sum
      region_name: region_name
      temp_max: temp_max
      temp_mean: temp_mean
      temp_min: temp_min
      temp_std: temp_std
      wind_speed_mean: wind_speed_mean
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: utf-8
    file_format: csv
    filename_glob: weather_monthly_from_db.csv
    frequency: monthly
    last_verified_at: '2026-05-26'
    limitations:
    - 'Source: solar_beam.raw_weather (KMA ASOS hourly → monthly aggregate
      via SQL extract). 17개 시도 × 60개월 (2020-01 ~ 2024-12).'
    - HISTORICAL observation (not forecast). Use as exogenous backtest
      variable; for forward-looking signal use kma_village_fcst.
    - Aggregates derived in SQL (mean/std/min/max temp + mean humidity /
      cloud_cover / wind_speed + sum rainfall). Hourly raw data is not
      mirrored to this project.
    official_name: 'solar_beam.raw_weather monthly aggregates (mean/std temp +
      humidity/cloud/wind/rain)'
    schema_version: 1
    source_id: raw_weather_monthly_db_file
    source_priority: 1
    source_url: postgresql://devine.my:5432/solar_beam.raw_weather
    unit: mixed_celsius_pct_mps_mm
  kma_grid_xy_mapping_file:
    column_mapping:
      admin_code: 행정구역코드
      kind: 구분
      level1: 1단계
      level2: 2단계
      level3: 3단계
      lat_deg: 위도(시)
      lat_min: 위도(분)
      lat_sec: 위도(초)
      lng_deg: 경도(시)
      lng_min: 경도(분)
      lng_sec: 경도(초)
      nx: 격자 X
      ny: 격자 Y
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: utf-8
    file_format: xlsx
    filename_glob: kma_grid_xy_mapping.xlsx
    frequency: reference
    header_row: 0
    last_verified_at: '2026-05-26'
    limitations:
    - 'Source: 기상청 단기예보 활용가이드 별첨 (2510 = 25년 10월 발표 버전).
      3835 행정구역 × (nx, ny) + 위경도 매핑. 단기예보/초단기 API의 nx/ny 인자
      해석 reference 용도. SMP forecaster 자체에는 join 안 함 — 코드에서 정적
      lookup용으로 사용.'
    official_name: 기상청 단기예보 격자(X,Y)-위경도 매핑 (전국 동/읍/면)
    schema_version: 1
    sheet_name: 0
    source_id: kma_grid_xy_mapping_file
    source_priority: 1
    source_url: https://www.data.go.kr/data/15084084/openapi.do
    unit: grid_cells
  jkm_lng_daily_history_file:
    column_mapping:
      change_pct: Change %
      close: Price
      high: High
      low: Low
      open: Open
      trade_date: Date
      volume: Vol.
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: utf-8-sig
    file_format: csv
    filename_glob: jkm_daily_history.csv
    frequency: daily
    last_verified_at: '2026-05-26'
    limitations:
    - 'Source: investing.com JKM LNG futures historical (PLATTS, front-month).
      Daily OHLC; date format MM/DD/YYYY US.'
    - Spot/front-month — NOT the forward curve. Use jkm_lng_futures_curve_file
      for forward expectations.
    - Volume column may be empty (low liquidity on many days).
    - 'Resampled to monthly by build_lng_forecast_features as alternative
      LNG history with daily granularity (richer than FRED PNGASJPUSDM).'
    official_name: JKM LNG PLATTS daily historical (investing.com)
    schema_version: 1
    source_id: jkm_lng_daily_history_file
    source_priority: 1
    source_url: https://www.investing.com/commodities/lng-japan-korea-marker-platts-futures-historical-data
    trade_date_format: '%m/%d/%Y'
    unit: USD/MMBtu
  jkm_lng_futures_curve_file:
    column_mapping:
      contract_code: Code
      contract_month_label: Month
      prior_settle: Prior_Settle
      quote_date: Date
      quote_time_ct: Time_CT
      volume: Volume
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: utf-8
    file_format: csv
    filename_glob: lng_jkm_quotes.csv
    frequency: snapshot
    last_verified_at: '2026-05-26'
    limitations:
    - 'Source: CME JKM LNG futures forward curve (front-month + further-out).
      Single snapshot per file; quote_date is the as-of date.'
    - This IS the leading-indicator the rest of the pipeline needs — at
      forecast_origin_month M, the contract whose contract_month_label =
      M+h gives the market''s expectation of LNG at M+h.
    - 'Historical forward curves are NOT included (one snapshot only) →
      can only inform forecasts FROM the quote_date onwards; backtesting
      with this source requires multiple snapshots accumulated over time.'
    - 'Code format JKMXY where X = contract month letter (F=Jan, G=Feb,
      H=Mar, J=Apr, K=May, M=Jun, N=Jul, Q=Aug, U=Sep, V=Oct, X=Nov, Z=Dec)
      and Y = single-digit year (0..9, rolling).'
    official_name: CME JKM LNG futures forward curve snapshot
    quote_date_format: '%d %b %Y'
    schema_version: 1
    source_id: jkm_lng_futures_curve_file
    source_priority: 1
    source_url: https://www.cmegroup.com/markets/energy/natural-gas/lng-japan-korea-marker-platts-swap.quotes.html
    unit: USD/MMBtu
  oil_price_monthly_file:
    column_mapping:
      oil_price_usd_per_bbl: oil_price_usd_per_bbl
      period_month: period_month
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: utf-8
    file_format: csv
    filename_glob: oil_price_monthly.csv
    frequency: monthly
    last_verified_at: '2026-05-26'
    limitations:
    - Source = FRED POILDUBUSDM (Dubai crude monthly average, USD per barrel).
      Exported from solar_beam PostgreSQL `oil_price` table.
    - Monthly avg; published with similar lag profile to LNG (~mid-M+1).
      Used as exogenous input to the LNG forecaster (round 7).
    official_name: FRED POILDUBUSDM monthly Dubai crude price
    schema_version: 1
    source_id: oil_price_monthly_file
    source_priority: 1
    source_url: https://fred.stlouisfed.org/series/POILDUBUSDM
    unit: USD/barrel
  fx_usd_krw_monthly_file:
    column_mapping:
      period_month: period_month
      usd_krw_monthly_avg: usd_krw_monthly_avg
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: utf-8
    file_format: csv
    filename_glob: usd_krw_monthly.csv
    frequency: monthly
    last_verified_at: '2026-05-26'
    limitations:
    - Source = FRED DEXKOUS (daily USD/KRW exchange rate) → resampled to
      monthly mean in solar/ DB extraction.
    - Monthly mean is fully observable at end-of-M (daily ECOS data is
      available next day with negligible lag), so the unlagged value IS a
      legitimate feature for forecasting M+1 LNG.
    official_name: USD/KRW monthly average (FRED DEXKOUS resampled)
    schema_version: 1
    source_id: fx_usd_krw_monthly_file
    source_priority: 1
    source_url: https://fred.stlouisfed.org/series/DEXKOUS
    unit: KRW/USD
  lng_price_monthly_file:
    column_mapping:
      lng_price_usd_per_mmbtu: lng_price_usd_per_mmbtu
      period_month: period_month
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: utf-8
    file_format: csv
    filename_glob: lng_price_monthly.csv
    frequency: monthly
    last_verified_at: '2026-05-25'
    limitations:
    - Source = FRED PNGASJPUSDM (Global LNG price, Asia, USD per Million MMBtu).
      Exported from solar_beam PostgreSQL via solar/lng_model.py companion.
    - Monthly value is the JKM monthly average — published mid-month for the
      preceding month. We treat LNG(M) as observable at end-of-M (information
      cutoff), consistent with the rest of the project's forecast contract.
    - 'Forecast horizon: LNG(M+1) ≈ LNG(M) (persistence baseline from
      solar/lng_model.py). More sophisticated LNG forecasts from
      solar/benchmark.py can replace this file later.'
    official_name: FRED PNGASJPUSDM monthly LNG price (Asia)
    schema_version: 1
    source_id: lng_price_monthly_file
    source_priority: 1
    source_url: https://fred.stlouisfed.org/series/PNGASJPUSDM
    unit: USD/MMBtu
  kpx_capacity_yearly_by_energy_source_home_file:
    column_mapping:
      row_category: 구분
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: cp949
    file_format: csv
    filename_glob: HOME_발전설비_연도별_에너지원별*.csv
    frequency: yearly
    header_rows:
    - 0
    - 1
    last_verified_at: '2026-05-25'
    limitations:
    - Yearly snapshot — capacity values are end-of-year (vendor unspecified, treat
      as static for the calendar year).
    - Year is parsed from filename via regex '\((\d{4})\)' — not from the file
      content. Files without a year in the filename will fail.
    - Row 0 has merged level1 headers (수력/기력/복합화력/원자력/신재생/집단/내연력/기타/총계);
      row 1 has level2 sub-categories. Loader flattens via 'level1|level2'.
    - Row category column ("구분") changes shape across years (2024 starts with 총계;
      earlier years start with 양수 etc). Loader preserves all rows; downstream
      builders must filter by row_category as needed.
    - Capacity values exclude 구역전기사업설비 and 자가용전기설비 per vendor.
    official_name: HOME 발전설비 연도별 에너지원별
    period_from_filename_regex: \((\d{4})\)
    schema_version: 1
    source_id: kpx_capacity_yearly_by_energy_source_home_file
    source_priority: 1
    source_url: https://www.data.go.kr/data/15046155/fileData.do
    unit: MW
  kpx_capacity_monthly_by_fuel_home_file:
    column_mapping:
      business_type: 사업구분
      dispatch_type: 급전방식
      member_type: 회원구분
      period: 기간
      region: 지역
    default_filters:
      business_type: 합계
      dispatch_type: 합계
      member_type: 합계
      region: 합계
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: cp949
    file_format: csv
    filename_glob: HOME_발전설비_연료원별.csv
    frequency: monthly
    fuel_type_mapping:
      LNG: lng
      기타: other
      무연탄: coal_anthracite
      신재생|바이오: renewable_bio
      신재생|석탄가스화: renewable_igcc
      신재생|수력: renewable_hydro
      신재생|연료전지: renewable_fuel_cell
      신재생|태양: renewable_solar
      신재생|폐기물: renewable_waste
      신재생|풍력: renewable_wind
      신재생|해양: renewable_marine
      양수: pumped_storage
      원자력: nuclear
      유류: oil
      유연탄: coal_bituminous
      합계: total
    header_rows:
    - 0
    - 1
    last_verified_at: '2026-05-25'
    limitations:
    - MVP uses only (회원구분=합계, 급전방식=합계, 사업구분=합계, 지역=합계) rows;
      area- or member-level breakdowns are dropped during canonical filtering.
    - 신재생 (renewable) has no aggregate column — renewable_total is computed as
      the sum of renewable_* sub-fuels in the feature builder, not the loader.
    - Capacity values exclude 구역전기사업설비 and 자가용전기설비 per vendor.
    official_name: HOME 발전설비 연료원별 (월별)
    period_format: '%Y/%m'
    schema_version: 1
    source_id: kpx_capacity_monthly_by_fuel_home_file
    source_priority: 1
    source_url: https://www.data.go.kr/data/15046115/fileData.do
    unit: MW
  kpx_capacity_monthly_by_generation_type_home_file:
    column_mapping:
      business_type: 사업구분
      dispatch_type: 급전방식
      member_type: 회원구분
      period: 기간
      region: 지역
    default_filters:
      business_type: 합계
      dispatch_type: 합계
      member_type: 합계
      region: 합계
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: cp949
    file_format: csv
    filename_glob: HOME_발전설비_발전형식별.csv
    frequency: monthly
    generation_type_mapping:
      기력|가스: steam_gas
      기력|무연탄: steam_coal_anthracite
      기력|유류: steam_oil
      기력|유연탄: steam_coal_bituminous
      내연력|가스: internal_combustion_gas
      내연력|유류: internal_combustion_oil
      복합화력|가스: combined_gas
      복합화력|유류: combined_oil
      신재생: renewable
      양수: pumped_storage
      원자력: nuclear
      기타: other
      합계: total
    header_rows:
    - 0
    - 1
    last_verified_at: '2026-05-25'
    limitations:
    - MVP uses only (회원구분=합계, 급전방식=합계, 사업구분=합계, 지역=합계) rows.
    - 'Generation type taxonomy differs from kpx_capacity_monthly_by_fuel_home_file:
      do NOT join capacity_type_* with capacity_fuel_* under the same canonical name.'
    - Capacity values exclude 구역전기사업설비 and 자가용전기설비 per vendor.
    official_name: HOME 발전설비 발전형식별 (월별)
    period_format: '%Y/%m'
    schema_version: 1
    source_id: kpx_capacity_monthly_by_generation_type_home_file
    source_priority: 1
    source_url: https://www.data.go.kr/data/15046116/fileData.do
    unit: MW
  kpx_transaction_amount_daily_by_fuel_file:
    column_mapping:
      fuel_name: 연료원
      trade_date: 거래일
      transaction_amount_krw: 전력거래금액(원)
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: cp949
    file_format: csv
    filename_glob: 한국전력거래소_연료원별 일별 전력거래금액.csv
    frequency: daily
    fuel_type_mapping:
      LNG: lng
      기타: other
      무연탄: coal_anthracite
      바이오SRF: renewable_bio_srf
      바이오가스: renewable_biogas
      바이오매스: renewable_biomass
      수력: renewable_hydro
      양수: pumped_storage
      연료전지: renewable_fuel_cell
      원자력: nuclear
      유류: oil
      유연탄: coal_bituminous
      태양광: renewable_solar
      풍력: renewable_wind
      폐기물: renewable_waste
      해양: renewable_marine
    header_row: 0
    header_rows: null
    last_verified_at: '2026-05-25'
    limitations:
    - Vendor file column is named '전력거래금액(원)' → unit is KRW. Some data.go.kr
      description pages mislabel this as MWh; the file header takes precedence.
    - Only market-participating generators (PPA/BTM excluded).
    - Subject to revision (수정정산) — newer snapshots supersede older ones via
      revision dedup policy.
    official_name: 한국전력거래소 연료원별 일별 전력거래금액
    schema_version: 1
    source_id: kpx_transaction_amount_daily_by_fuel_file
    source_priority: 1
    source_url: https://www.data.go.kr/data/15153665/fileData.do
    trade_date_format: '%Y-%m-%d'
    unit: KRW
  kpx_transaction_volume_hourly_by_fuel_file:
    column_mapping:
      fuel_name: 연료원
      trade_date: 거래일
      trade_hour: 거래시간
      transaction_volume_mwh: 전력거래량(MWh)
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: cp949
    file_format: csv
    filename_glob: 한국전력거래소_연료원별 전력거래량_*.csv
    frequency: hourly
    fuel_type_mapping:
      LNG: lng
      기타: other
      무연탄: coal_anthracite
      신재생: renewable
      양수: pumped_storage
      원자력: nuclear
      유류: oil
      유연탄: coal_bituminous
    header_row: 0
    header_rows: null
    last_verified_at: '2026-05-25'
    limitations:
    - trade_hour 1..24 maps to interval_end (date, hour:00). trade_hour=24
      maps to (date+1, 00:00) — consistent with the SMP hour convention.
    - Only market-participating generators (PPA/BTM excluded).
    - Subject to revision (수정정산); see revision dedup policy.
    official_name: 한국전력거래소 연료원별 전력거래량 (시간대별)
    schema_version: 1
    source_id: kpx_transaction_volume_hourly_by_fuel_file
    source_priority: 1
    source_url: https://www.data.go.kr/data/15081098/fileData.do
    trade_date_format: '%Y-%m-%d'
    unit: MWh
  kpx_generation_yearly:
    candidate_source_id: kpx_generation_yearly
    encoding: cp949
    file_format: csv
    filename_globs_misnamed:
    - HOME_전력거래_계통한계가격_가중평균SMP.csv
    - HOME_전력거래_계통한계가격_가중평균SMP (2).csv
    frequency: yearly
    header_rows:
    - 0
    - 1
    last_verified_at: null
    limitations:
    - DO NOT load via SMP loader — content is generation MWh by fuel source, not SMP
      price.
    - Filename says 'SMP' but actual columns are 연도, 수력, 기력, 복합화력, 원자력, 신재생, ...
    - 'Quarantined this round: no loader implemented yet.'
    - Confirm unit (MWh vs MW·month) before building feature joins.
    official_name: 한국전력거래소 연도별 발전원별 발전량 (파일명은 'SMP'로 잘못 표기됨)
    reason: filename_content_mismatch
    schema_version: 0
    source_id: kpx_generation_yearly
    source_url: TBD_AFTER_FIRST_DOWNLOAD
    status: pending_schema_verification
    unit: MWh (suspected — verify)
  kpx_rec_monthly_file:
    column_mapping:
      contract_amount_million_krw: TBD_AFTER_FIRST_DOWNLOAD
      contract_volume_rec: TBD_AFTER_FIRST_DOWNLOAD
      spot_amount_million_krw: TBD_AFTER_FIRST_DOWNLOAD
      spot_volume_rec: TBD_AFTER_FIRST_DOWNLOAD
      year_month: TBD_AFTER_FIRST_DOWNLOAD
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: TBD_AFTER_FIRST_DOWNLOAD
    file_format: TBD_AFTER_FIRST_DOWNLOAD
    frequency: monthly
    header_row: 0
    header_rows: null
    last_verified_at: null
    limitations:
    - REC monthly summary loader skipped this round — yearly-summary xlsx files require
      dedicated handling.
    official_name: 한국전력거래소 신재생에너지 공급인증서(REC) 월간 거래현황
    schema_version: 0
    sheet_name: null
    source_id: kpx_rec_monthly_file
    source_priority: 1
    source_url: TBD_AFTER_FIRST_DOWNLOAD
    status: deferred_to_next_round
    units:
      amount: million KRW
      volume: REC
    year_month_format: TBD_AFTER_FIRST_DOWNLOAD
  kpx_rec_weekly_file:
    column_mapping:
      avg_price_krw: 평균가
      base_price_krw: 기준가
      close_price_krw: 종가
      high_price_krw: 최고가
      low_price_krw: 최저가
      open_price_krw: 시작가
      rec_volume: 체결 수량
      total_amount_krw: 체결총액
      trade_date: 거래일
    drop_rows_after_header: 0
    drop_rows_before: 0
    encoding: cp949
    file_format: csv
    filename_glob: 한국전력거래소_주간 신재생에너지 인증서(REC) 거래현황*.csv
    frequency: weekly_file_trading_day
    header_row: 0
    header_rows: null
    last_verified_at: '2026-05-24'
    limitations:
    - 파일명은 '주간'이지만 row 단위는 trading_day (장 운영일). 비거래일은 row가 없음.
    - 단가 단위는 KRW/REC. 체결총액 단위는 KRW (백만원 아님 — vendor 헤더 기준).
    - DST/timezone 영향 없음 (한국 표준시 거래일자).
    official_name: 한국전력거래소 주간 신재생에너지 인증서(REC) 거래현황
    schema_version: 1
    sheet_name: null
    source_id: kpx_rec_weekly_file
    source_priority: 1
    source_url: https://www.data.go.kr/data/15094820/fileData.do
